<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز استشارة | محمد البشير</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ================= ROOT ================= */
:root{
--gold:#d8b16c;
--gold2:#f8de9d;
--bg:#050816;
--text:#e9eeff;
}

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

/* ================= PAGE INTRO (ZOOM + FADE) ================= */
body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:var(--bg);
color:white;

opacity:0;
transform:scale(1.08);
animation:pageIn 1.2s ease forwards;
}

@keyframes pageIn{
to{
opacity:1;
transform:scale(1);
}
}

/* ================= BACKGROUND ================= */
.bg{
position:fixed;
inset:0;
overflow:hidden;
z-index:-10;
}

.bg::before{
content:"";
position:absolute;
inset:-200px;
background:
radial-gradient(circle at 20% 20%, rgba(248,222,157,.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(74,114,255,.15), transparent 40%),
radial-gradient(circle at 40% 90%, rgba(216,177,108,.12), transparent 45%);
animation:moveBg 12s infinite alternate ease-in-out;
}

@keyframes moveBg{
0%{transform:scale(1) translate(0,0);}
100%{transform:scale(1.2) translate(40px,-30px);}
}

/* floating lights */
.light{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(120px);
opacity:.25;
animation:float 10s infinite alternate ease-in-out;
}

.light1{
background:var(--gold);
top:10%;
right:10%;
}

.light2{
background:#4a72ff;
bottom:10%;
left:10%;
animation-delay:2s;
}

@keyframes float{
0%{transform:translate(0,0);}
100%{transform:translate(40px,-40px);}
}

/* ================= FORM BOX ================= */
.box{
width:460px;
padding:48px 42px;
border-radius:34px;
background:
linear-gradient(145deg,
rgba(255,255,255,.08),
rgba(255,255,255,.03));
border:1px solid rgba(248,222,157,.18);
backdrop-filter:blur(24px);
box-shadow:
0 30px 80px rgba(0,0,0,.6),
inset 0 0 0 1px rgba(255,255,255,.05);
text-align:center;
position:relative;
overflow:hidden;
transition:.5s;
}

/* hover */
.box:hover{
transform:translateY(-8px);
box-shadow:
0 40px 100px rgba(0,0,0,.75),
0 0 40px rgba(216,177,108,.15);
}

/* glow */
.box::before{
content:"";
position:absolute;
width:320px;
height:320px;
background:radial-gradient(circle,
rgba(248,222,157,.25),
transparent 70%);
top:-140px;
right:-140px;
opacity:.35;
animation:luxGlow 6s infinite alternate ease-in-out;
}

/* shine line */
.box::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(120deg,
transparent 0%,
rgba(248,222,157,.08) 40%,
transparent 60%);
transform:translateX(-100%);
animation:shine 5s infinite;
}

@keyframes shine{
0%{transform:translateX(-100%);}
50%{transform:translateX(100%);}
100%{transform:translateX(100%);}
}

@keyframes luxGlow{
0%{transform:translate(0,0) scale(1);}
100%{transform:translate(20px,-20px) scale(1.1);}
}

/* title */
h2{
font-size:32px;
font-weight:900;
margin-bottom:28px;
}

h2 span{
background:linear-gradient(to right,var(--gold2),#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* inputs */
input,textarea{
width:100%;
padding:14px;
margin:10px 0;
border-radius:14px;
border:1px solid rgba(255,255,255,.1);
background:rgba(0,0,0,.25);
color:white;
outline:none;
transition:.3s;
}

input:focus,textarea:focus{
border-color:var(--gold2);
box-shadow:0 0 15px rgba(248,222,157,.25);
}

textarea{
min-height:120px;
resize:none;
}

/* ================= BUTTON ================= */
button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:14px;
font-weight:800;
cursor:pointer;
background:linear-gradient(145deg,var(--gold2),#9c7433);
color:#111;
transition:.3s;
position:relative;
overflow:hidden;
}

button:hover{
transform:translateY(-5px);
box-shadow:0 15px 35px rgba(216,177,108,.25);
}

/* ================= SUCCESS STATE ================= */
button.success{
background:linear-gradient(145deg,#2ecc71,#27ae60);
color:white;
transform:scale(1.05);
box-shadow:0 15px 40px rgba(46,204,113,.35);
}

button.success::after{
content:"✔ تم الإرسال بنجاح";
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
background:inherit;
}

/* text */
p{
font-size:13px;
opacity:.7;
margin-top:12px;
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="bg">
<div class="light light1"></div>
<div class="light light2"></div>
</div>

<!-- FORM -->
<div class="box">

<h2>احجز <span>استشارتك</span></h2>

<form>
<input type="text" placeholder="الاسم الكامل" required>
<input type="tel" placeholder="رقم الهاتف" required>
<input type="text" placeholder="نوع القضية (اختياري)">
<textarea placeholder="اكتب تفاصيل الاستشارة..." required></textarea>

<button type="submit">إرسال الطلب</button>
</form>

<p>سيتم التواصل معك خلال أقرب وقت ⚖️</p>

</div>

<script>
const form = document.querySelector("form");
const button = document.querySelector("button");

form.addEventListener("submit", function(e){
    e.preventDefault();

    button.classList.add("success");
    button.disabled = true;

    setTimeout(() => {
        button.classList.remove("success");
        button.disabled = false;
    }, 3000);
});
</script>

</body>
</html>
